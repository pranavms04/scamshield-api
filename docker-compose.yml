services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scamshield
      POSTGRES_PASSWORD: scamshield
      POSTGRES_DB: scamshield
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamshield"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://scamshield:scamshield@db:5432/scamshield
      AUTO_CREATE_TABLES: "false"
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b

volumes:
  pgdata:
  ollama:
